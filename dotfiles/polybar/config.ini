; Polybar config — Tema Aura, barra superior minimalista

[colors]
bg = #0f0e17
bg-alt = #1a1b26
fg = #e0e0e0
fg-alt = #a0a0b0
accent = #a78bfa
accent-dim = #7c3aed
accent2 = #f472b6
border = #2d2d44
urgent = #ef4444
success = #22c55e
warning = #f59e0b

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
offset-x = 0
offset-y = 0
fixed-center = true
bottom = false

background = ${colors.bg}
foreground = ${colors.fg}

border-size = 0
border-color = ${colors.border}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Fira Code:size=10;2"
font-1 = "Fira Code:size=10;2"
font-2 = "Font Awesome 6 Free:size=10;2"
font-3 = "Font Awesome 6 Free Solid:size=10;2"
font-4 = "Font Awesome 6 Brands:size=10;2"

modules-left = i3 xwindow
modules-right = pulseaudio date

tray-position = none

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.accent}

label-focused = %index%
label-focused-background = ${colors.bg-alt}
label-focused-foreground = ${colors.accent}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-background = ${colors.bg-alt}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-empty = i3wm

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

label-muted = 🔇 muted
label-muted-foreground = ${colors.fg-alt}

ramp-volume-0 = 🔈
ramp-volume-1 = 🔉
ramp-volume-2 = 🔊

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.fg}

[settings]
screenchange-reload = true
pseudo-transparency = true
