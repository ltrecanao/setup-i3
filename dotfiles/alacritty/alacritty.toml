# Alacritty config — Tema Aura

[font]
normal = { family = "Fira Code", style = "Regular" }
bold = { family = "Fira Code", style = "Bold" }
italic = { family = "Fira Code", style = "Italic" }
size = 11.0

[window]
opacity = 0.9
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "full"
startup_mode = "Windowed"

[colors]
[colors.primary]
background = "#0f0e17"
foreground = "#e0e0e0"

[colors.cursor]
text = "#0f0e17"
cursor = "#a78bfa"

[colors.normal]
black = "#1a1b26"
red = "#ef4444"
green = "#22c55e"
yellow = "#f59e0b"
blue = "#a78bfa"
magenta = "#f472b6"
cyan = "#22d3ee"
white = "#e0e0e0"

[colors.bright]
black = "#2d2d44"
red = "#f87171"
green = "#4ade80"
yellow = "#fbbf24"
blue = "#c4b5fd"
magenta = "#f9a8d4"
cyan = "#67e8f9"
white = "#f5f5f5"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
